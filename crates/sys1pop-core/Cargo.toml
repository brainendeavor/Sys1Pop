[package]
name = "sys1pop-core"
version = "0.1.0"
edition = "2021"
description = "Pure Rust core algorithms, decision heads, and contracts for Sys1Pop"

[dependencies]
candle-core = { version = "0.8", default-features = false }
candle-nn = { version = "0.8", default-features = false }
candle-transformers = { version = "0.8", default-features = false }
tokenizers = { version = "0.21", default-features = false, features = ["unstable_wasm"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
