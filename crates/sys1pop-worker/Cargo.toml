[package]
name = "sys1pop-worker"
version = "0.1.0"
edition = "2021"
description = "Turnkey Cloudflare Worker microservice for Sys1Pop"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sys1pop-core = { path = "../sys1pop-core" }
worker = { version = "0.7", features = ["http"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
getrandom = { version = "0.2", features = ["js"] }
wasm-bindgen = "0.2"
once_cell = "1.19"
lru = "0.13"
